  - id: p82
    breaking: false
    final:
      name: onboarding_completed
      section: Getting started
      description: "Fires on the client once the final onboarding step succeeds. This is the step where the user saves their
        profile (bio) and the updateProfile mutation sets completedOnboarding: true and returns success. It fires in the
        mutation's onSuccess handler, after the default event types are created when the user has none, and before the
