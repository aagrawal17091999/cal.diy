    final:
      name: signup_form_submit_error
      section: Signup
      description: Fires on the client when the signup submit handler throws (the fetchSignup call or the follow-up signIn
        raises), after the Turnstile token has been reset. It does not fire for the Cloudflare invalid-token error
        (INVALID_CLOUDFLARE_TOKEN_ERROR is returned silently). It does not fire when the API answers with a non-ok
        result that is handled in code, such as the user-already-exists case, which shows a warning toast and redirects
        to login.
      question: How many signup attempts fail, and why?
      track_via: client
      properties:
        - name: error_message
          type: string
          example: UNCONFIRMED
          description: The thrown Error's message, or the translated unexpected_error_try_again text. Free text from the server or
            the client.
        - name: has_token
          type: boolean
          example: true | false
          description: Whether the signup URL carries an invite token
        - name: is_org_invite
          type: boolean
          example: true | false
          description: Organization invite by link; may be undefined or an empty string when there is no orgSlug
        - name: is_premium_username
          type: boolean
          example: true | false
          description: Whether the chosen username is a premium one
        - name: org_slug
