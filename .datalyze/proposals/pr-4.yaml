    changelog: "Fixed: Signup failure is a separate event and signup has no outcome event to hold status + failure_reason"
    finding:
      id: F1
      severity: medium
      fix: "Add one outcome event (e.g. signup_completed) with status = success | failed | cancelled and failure_reason
        (enum). Use values read from the code: user_already_exists, invalid_cloudflare_token, checkout_required,
        under_review, api_error, sign_in_failed. Do not rename signup_form_submit_error in place. Dual-fire both events
        for one release (dual_fire_until on the old entry), then mark the old entry deprecated with deprecated_reason
        and replaced_by. Add a SEMANTICS changelog line. Dashboards on this event's question 'How many signup attempts
        fail, and why?' move to the new event."
      verdict: confirmed
